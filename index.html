<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#130913">
<title>Sakura Reselling – Wartungsarbeiten</title>
<style>
:root{color-scheme:dark;--bg:#100914;--surface:#1a0e1d;--text:#fff0f6;--muted:#c4a3b7;--line:#3a1d37;--pink:#ff4f9a;--pink2:#e0287a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(255,79,154,.16),transparent 55%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,620px);text-align:center;padding:54px 34px;border:1px solid var(--line);border-radius:28px;background:rgba(26,14,29,.88);box-shadow:0 28px 90px rgba(0,0,0,.35)}
.mark{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:linear-gradient(135deg,var(--pink2),var(--pink));font-size:32px;box-shadow:0 10px 36px rgba(255,79,154,.24)}
.eyebrow{color:var(--pink);font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{margin:12px 0 14px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.08;letter-spacing:-.04em}
p{margin:0 auto;color:var(--muted);max-width:46ch}
.line{width:52px;height:3px;margin:30px auto 0;border-radius:4px;background:linear-gradient(90deg,var(--pink2),var(--pink))}
small{display:block;margin-top:28px;color:#98768d;font-size:.8rem}
@media(max-width:480px){main{padding:42px 22px}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🌸</div>
  <div class="eyebrow">Sakura Reselling</div>
  <h1>Wir sind bald zurück.</h1>
  <p>Unsere Website ist vorübergehend wegen Wartungsarbeiten nicht erreichbar. Wir arbeiten daran, bald wieder für euch da zu sein.</p>
  <div class="line"></div>
  <small>Temporarily unavailable · Thank you for your patience.</small>
</main>
</body>
</html>
